<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Граф связей</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; font-family: Segoe UI; background: #1B1C1E; color: #E8E8E8; }
        svg { width: 100vw; height: 100vh; }
        .node { cursor: pointer; }
        .node circle { stroke: #fff; stroke-width: 2px; }
        .node text { font: 12px sans-serif; fill: #E8E8E8; }
        .link { stroke: #999; stroke-opacity: 0.6; stroke-width: 1.5px; }
        .link.bom { stroke: #4CAF50; }
        .link.usage { stroke: #2196F3; }
        .link.link { stroke: #FF9800; }
        .center circle { fill: #F44336; }
        .bom_child circle { fill: #4CAF50; }
        .bom_parent circle { fill: #9C27B0; }
        .usage circle { fill: #2196F3; }
        .link circle { fill: #FF9800; }
    </style>
</head>
<body>
    <div id="title" style="position:absolute;top:20px;left:20px;font-size:24px;"></div>
    <div id="legend" style="position:absolute;top:60px;left:20px;font-size:14px;line-height:1.8;">
        <span style="color:#F44336">●</span> Центр<br>
        <span style="color:#4CAF50">●</span> BOM-дети<br>
        <span style="color:#9C27B0">●</span> BOM-родители<br>
        <span style="color:#2196F3">●</span> Usage<br>
        <span style="color:#FF9800">●</span> Links
    </div>
    <svg></svg>
    <script>
        const name = new URLSearchParams(window.location.search).get('name');
        document.getElementById('title').textContent = 'Граф: ' + name;
        fetch('/graph/data?name=' + encodeURIComponent(name) + '&token=' + localStorage.getItem('token'))
            .then(r => r.json())
            .then(data => {
                const svg = d3.select('svg');
                const width = window.innerWidth;
                const height = window.innerHeight;
                const simulation = d3.forceSimulation(data.nodes)
                    .force('link', d3.forceLink(data.links).id(d => d.id).distance(80))
                    .force('charge', d3.forceManyBody().strength(-300))
                    .force('center', d3.forceCenter(width / 2, height / 2));
                const link = svg.append('g').selectAll('line').data(data.links).enter().append('line').attr('class', d => 'link ' + d.kind);
                const node = svg.append('g').selectAll('g').data(data.nodes).enter().append('g').attr('class', d => 'node ' + d.kind).call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended));
                node.append('circle').attr('r', d => d.kind === 'center' ? 12 : 8);
                node.append('text').text(d => d.name).attr('dx', 15).attr('dy', 4);
                node.on('click', (event, d) => { if (d.kind !== 'center') window.location.href = '/graph?name=' + d.name; });
                simulation.on('tick', () => {
                    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                    node.attr('transform', d => `translate(${d.x},${d.y})`);
                });
                function dragstarted(event) { if (!event.active) simulation.alphaTarget(0.3).restart(); event.subject.fx = event.subject.x; event.subject.fy = event.subject.y; }
                function dragged(event) { event.subject.fx = event.x; event.subject.fy = event.y; }
                function dragended(event) { if (!event.active) simulation.alphaTarget(0); event.subject.fx = null; event.subject.fy = null; }
            });
    </script>
</body>
</html>
