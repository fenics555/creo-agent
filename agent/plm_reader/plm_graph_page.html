<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Creo PLM — граф изделий</title>
<style>
 *{box-sizing:border-box} body{margin:0;font:13px/1.45 "Segoe UI",Arial,sans-serif;
   background:#14171a;color:#dfe6ee;display:flex;height:100vh;overflow:hidden}
 /* ЛЕВОЕ ОКНО: ширина задаётся перетаскиванием #vgrip */
 #side{width:340px;min-width:200px;display:flex;flex-direction:column;
   background:#181c21;border-right:1px solid #2a3138;overflow:hidden;flex:0 0 auto}
 /* ПЕРЕГОРОДКИ: вертикальная (слева) и горизонтальная (между карточкой и графом) */
 #vgrip,#hgrip{background:#232a31;flex:0 0 6px;position:relative;z-index:5}
 #vgrip{cursor:col-resize}
 #hgrip{cursor:row-resize;width:100%}
 #vgrip:hover,#hgrip:hover{background:#56a6ff}
 #side h1{margin:0;padding:12px 14px;font-size:15px;background:#1f252b;border-bottom:1px solid #2a3138}
 #filters{padding:10px 12px;border-bottom:1px solid #2a3138}
 #filters input,#filters select{width:100%;padding:7px 9px;margin-bottom:7px;background:#11151a;
   color:#dfe6ee;border:1px solid #2f373f;border-radius:5px;font-size:13px}
 #stats{padding:6px 12px;font-size:11px;color:#8fa0b3;border-bottom:1px solid #2a3138}
 /* МИНИАТЮРЫ В СПИСКЕ: жёстко фиксированные, не тянутся и не сжимают текст */
 .row img{width:__THUMB__px;height:__THUMB__px;min-width:__THUMB__px;max-width:__THUMB__px;object-fit:contain;
   background:#0d1115;border-radius:4px;flex:0 0 __THUMB__px;display:block}
 .row .noimg{width:__THUMB__px;height:__THUMB__px;min-width:__THUMB__px;flex:0 0 __THUMB__px;
  background:#141a20;border:1px dashed #2f3a44;border-radius:4px;display:flex;
  align-items:center;justify-content:center;font-size:9px;color:#54636f}
.row .nm{flex:1 1 auto;min-width:0;overflow:hidden}
 .row .nm b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row .nm span{display:block;font-size:10px;color:#7f8fa2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 /* ЦЕНТР: min-height:0 обязателен — иначе flex:1 не даёт скролла внутри */
 #main{flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;height:100%}
 /* ВЕРХНЕЕ ОКНО (карточка): фиксированная высота + свой скролл */
 #card{padding:14px 18px;background:#1a1f25;height:__CARDH__px;min-height:120px;
   overflow:auto;flex:0 0 auto}
 #list{overflow:auto;flex:1}
 .row{display:flex;gap:9px;padding:7px 11px;cursor:pointer;border-bottom:1px solid #20262c;align-items:center}
 .row:hover{background:#212831}.row.on{background:#26313c;border-left:3px solid #56a6ff}
 #card h2{margin:0 0 8px;font-size:16px}
 #card .meta{font-size:11px;color:#8fa0b3;margin-bottom:10px;word-break:break-all}
 #card .flex{display:flex;gap:18px}
 /* ПРЕВЬЮ В КАРТОЧКЕ: картинка, ниже — чертёж; своя прокрутка, если не влезают */
 #card .prev{width:200px;flex:0 0 200px;background:#0d1115;border-radius:6px;
   display:flex;flex-direction:column;align-items:center;gap:6px;overflow:auto;padding:6px}
 #card .prev figure{margin:0;text-align:center}
 #card .prev img{max-width:186px;max-height:186px;border-radius:4px;display:block}
 #card .prev figcaption{font-size:10px;color:#7f8fa2;padding-top:2px}
 .cols{flex:1;display:flex;gap:16px;font-size:12px}
 .cols div{flex:1;min-width:0}
 .cols h3{margin:0 0 5px;font-size:12px;color:#9fb1c4;text-transform:uppercase;letter-spacing:.4px}
 .cols ul{margin:0;padding-left:15px}.cols li{cursor:pointer;margin-bottom:2px;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .cols li:hover{color:#56a6ff;text-decoration:underline}
 .t{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;margin-right:5px;background:#2c3641;color:#9fb1c4}
 .t.mfg{background:#4a2f2f;color:#ffb3b3}.t.as{background:#2f3f4a;color:#9fd0ff}.t.pr{background:#2f4a35;color:#a6e3b8}
 #graph{flex:1 1 auto;overflow:auto;background:#101418;min-height:0;position:relative}
 #graph svg{display:block}
 text{fill:#c8d4e0;font:11px "Segoe UI",Arial}
</style></head><body>
<div id="side">
  <h1>Creo PLM — граф изделий</h1>
  <div id="filters">
    <input id="q" placeholder="Поиск по имени…">
    <select id="fk">
      <option value="">— все типы —</option>
      <option value="ASSEMBLY/ASSEM_MFG">обработка (ASSEM_MFG)</option>
      <option value="ASSEMBLY">сборки</option>
      <option value="PART">детали</option>
    </select>
    <select id="fv"><option value="">— все версии Creo —</option></select>
    <select id="fs">
      <option value="all">— все модели —</option>
      <option value="linked">только связанные</option>
      <option value="img">только с превью</option>
      <option value="loose">одиночки без связей</option>
    </select>
  </div>
  <div id="stats"></div>
  <div id="list"></div>
</div>
<div id="vgrip" title="Потяните, чтобы изменить ширину списка"></div>
<div id="main">
  <div id="card"><h2>Выберите модель слева</h2>
    <div class="meta">Данные собраны из файлов Creo «в лоб» — без запуска Creo.</div></div>
  <div id="hgrip" title="Потяните, чтобы изменить высоту карточки"></div>
  <div id="graph"></div>
</div>
<script>
const ND = __DATA__;
const ST = __STATS__;
const IMG = "__MEDIA__/";
let cur = null, shown = [];
const list = document.getElementById("list");
const q = document.getElementById("q"), fk = document.getElementById("fk"),
      fv = document.getElementById("fv"), fs = document.getElementById("fs");
[...new Set(Object.values(ND).map(n => n.v))].sort().forEach(v => {
  const o = document.createElement("option"); o.value = v; o.textContent = v; fv.appendChild(o);
});
function kindTag(n){
  if (n.m) return '<span class="t mfg">MFG</span>';
  if (n.k.startsWith("ASSEMBLY")) return '<span class="t as">ASM</span>';
  return '<span class="t pr">PRT</span>';
}
function matches(m){
  const n = ND[m];
  if (q.value && !m.toLowerCase().includes(q.value.toLowerCase())) return false;
  if (fk.value && n.k !== fk.value) return false;
  if (fv.value && n.v !== fv.value) return false;
  const linked = n.o.length + n.n.length;
  if (fs.value === "linked" && !linked) return false;
  if (fs.value === "img" && !n.i) return false;
  if (fs.value === "loose" && linked) return false;
  return true;
}

// --- ПЕРЕТАСКИВАЕМЫЕ ПЕРЕГОРОДКИ: слева (список), сверху (карточка) ---
(function(){
  const side = document.getElementById("side"), vg = document.getElementById("vgrip");
  const card = document.getElementById("card"), hg = document.getElementById("hgrip");
  let drag = null;
  const grab = which => e => { drag = which; e.preventDefault(); };
  vg.addEventListener("mousedown", grab("v"));
  hg.addEventListener("mousedown", grab("h"));
  window.addEventListener("mousemove", e => {
    if (drag === "v"){
      const w = Math.min(Math.max(e.clientX, 170), window.innerWidth - 260);
      side.style.width = w + "px";
      side.style.minWidth = w + "px";
    } else if (drag === "h"){
      const top = document.getElementById("main").getBoundingClientRect().top;
      const h = Math.min(Math.max(e.clientY - top, 90), window.innerHeight - 150);
      card.style.height = h + "px";
      card.style.maxHeight = "none";
    }
  });
  window.addEventListener("mouseup", () => { drag = null; });
  vg.addEventListener("touchstart", grab("v"), {passive:false});
  hg.addEventListener("touchstart", grab("h"), {passive:false});
  window.addEventListener("touchmove", e => {
    if (!drag) return;
    const t = e.touches[0];
    if (drag === "v"){
      const w = Math.min(Math.max(t.clientX, 170), window.innerWidth - 260);
      side.style.width = w + "px"; side.style.minWidth = w + "px";
    } else {
      const top = document.getElementById("main").getBoundingClientRect().top;
      const h = Math.min(Math.max(t.clientY - top, 90), window.innerHeight - 150);
      card.style.height = h + "px"; card.style.maxHeight = "none";
    }
    e.preventDefault();
  }, {passive:false});
  window.addEventListener("touchend", () => { drag = null; });
})();
function render(){
  const keys = Object.keys(ND).filter(matches).sort((a,b) =>
    (ND[b].o.length + ND[b].n.length) - (ND[a].o.length + ND[a].n.length) || a.localeCompare(b));
  shown = keys.slice(0, __LISTMAX__);
  list.innerHTML = shown.map(m => {
    const n = ND[m], linked = n.o.length + n.n.length;
    // если превью нет — показываем заглушку с типом, а не пустой квадрат
    const im = n.i ? '<img loading="lazy" src="' + IMG + n.i + '" title="' + n.i + '">'
                   : '<div class="noimg" title="в файле нет превью">' +
                     (n.k.split("/")[0].slice(0, 4)) + '</div>';
    return '<div class="row" data-m="' + m + '">' + im +
      '<div class="nm"><b>' + kindTag(n) + m + '</b><span>' + n.v +
      ' · состав ' + n.o.length + ' · входит ' + n.n.length + ' · ' +
      (n.s/1048576).toFixed(2) + ' МБ</span></div></div>';
  }).join("");
  document.getElementById("stats").textContent =
    "показано " + shown.length + " из " + keys.length + " · моделей " +
    Object.keys(ND).length + " · рёбер " + ST.edges +
    " · с превью " + (ST.media || 0) + " · без превью " + (ST.no_img || 0);
}
list.addEventListener("click", e => {
  const r = e.target.closest(".row"); if (r) show(r.dataset.m);
});
[q, fk, fv, fs].forEach(el => el.addEventListener("input", render));

function show(m){
  cur = m; const n = ND[m];
  document.querySelectorAll(".row").forEach(r =>
    r.classList.toggle("on", r.dataset.m === m));
  // КАРТИНКА и ЧЕРТЁЖ — оба (требование владельца). Верх — главный вид, ниже — второй.
  let prev = '';
  if (n.i) prev += '<figure><img src="' + IMG + n.i + '" alt="картинка">' +
                   '<figcaption>картинка модели</figcaption></figure>';
  if (n.i2) prev += '<figure><img src="' + IMG + n.i2 + '" alt="чертёж">' +
                    '<figcaption>чертёж</figcaption></figure>';
  if (!prev) prev = '<span style="color:#5a6773;text-align:center;padding:10px">' +
                    'нет превью<br><small>в файле нет картинки/чертежа</small></span>';
  const li = arr => arr.length ? arr.slice(0, __LINKSMAX__).map(x =>
      '<li data-m="' + x[0] + '"><span class="t">' + x[1] + '</span>' + x[0] + '</li>').join("")
    : "<li style='color:#5a6773'>—</li>";
  document.getElementById("card").innerHTML =
    '<h2>' + m + '</h2>' +
    '<div class="meta">' + kindTag(n) + ' тип ' + n.k + ' · Creo ' + n.v +
      ' · ' + (n.s/1048576).toFixed(2) + ' МБ<br>' + n.p + '</div>' +
    '<div class="flex"><div class="prev">' + prev + '</div>' +
    '<div class="cols"><div><h3>Состав — что использует (' + n.o.length +
      ')</h3><ul>' + li(n.o) + '</ul></div>' +
    '<div><h3>Куда входит (' + n.n.length + ')</h3><ul>' + li(n.n) + '</ul></div></div></div>';
  document.querySelectorAll("#card li").forEach(el =>
    el.addEventListener("click", () => show(el.dataset.m)));
  draw(m);
}
// ЦВЕТА СВЯЗЕЙ (4 основных + 2 редких):
//  main-down   основные ОТ выбранного (прямые дети)      — зелёный
//  main-up     основные К выбранному (прямые родители)   — голубой
//  deep-down   связи ВНИЗ (транзитные потомки)           — тёмно-зелёный
//  deep-up     связи ВВЕРХ (транзитные предки)           — тёмно-синий
//  base        база/заготовка (_Z, MERGE_BASE_PART)      — жёлтый
//  copy        копия (from_mdl_name)                     — фиолетовый
const CLR = {
  "main-down": {"s": "#4ec97a", "t": "основные от выбранного"},
  "main-up":   {"s": "#4ea8e0", "t": "основные к выбранному"},
  "deep-down": {"s": "#2f7a4a", "t": "связи вниз (через узел)"},
  "deep-up":   {"s": "#2f5a8a", "t": "связи вверх (через узел)"},
  "base":      {"s": "#d8b74a", "t": "заготовка / база"},
  "copy":      {"s": "#a97cd8", "t": "копия модели"}
};

function edgeKind(from, to){
  // тип ребра по данным (роль уже есть в списках), плюс спецтипы
  const arr = (ND[from] && ND[from].o) || [];
  for (const t of arr){ if (t[0] === to) {
    if (t[1] === "заготовка" || t[1] === "база/заготовка") return "base";
    if (t[1] === "копия") return "copy";
    return "child";
  } }
  return "parent";
}

function draw(root){
  const N = {0: [root]}, L = [];
  // ДВА НЕЗАВИСИМЫХ ОБХОДА: вниз (потомки) и вверх (предки).
  // Раньше был один проход — он уходил только вниз и «вверх» не рисовался никогда.
  function go(start, dir){
    // ⚠️ ГРАБЛЯ: dir ДОЛЖЕН быть числом (+1 вниз / -1 вверх).
    // Раньше было `depth * dir` со строкой "d" → NaN → уровни NaN → ГРАФ ПУСТ.
    const sign = (dir === "d") ? 1 : -1;
    const seen = new Set([root]);
    let frontier = [start];
    let total = 1;
    for (let depth = 1; depth <= __DEPTH__ && frontier.length; depth++){
      const next = [];
      for (const m of frontier){
        if (total > __NODESMAX__) return;
        const n = ND[m]; if (!n) continue;
        const use = (dir === "d" ? n.o : n.n) || [];
        for (const t of use.slice(0, __CHILDMAX__)){
          const nm = t[0];
          if (!ND[nm] || nm === root || seen.has(nm)) continue;
          seen.add(nm);
          total++;
          const lvl = depth * sign;              // ЧИСЛО: +1,+2,+3 или -1,-2,-3
          (N[lvl] = N[lvl] || []).push(nm);
          const role = edgeKind(dir === "d" ? m : nm, dir === "d" ? nm : m);
          const main = (depth === 1);
          const k = (role === "base" || role === "copy") ? role
                  : (main ? "main-" + dir : "deep-" + dir);
          // ребро в данных ND всегда «родитель → ребёнок»:
          const eFrom = dir === "d" ? m : nm, eTo = dir === "d" ? nm : m;
          L.push([eFrom, eTo, k]);
          next.push(nm);
        }
      }
      frontier = next;
    }
  }
  go(root, "d");   // вниз: main-down (1-й уровень), deep-down (глубже)
  go(root, "u");   // вверх: main-up (1-й уровень), deep-up (глубже)

  const rows = {};
  Object.entries(N).forEach(([m, d]) => { (rows[d] = rows[d] || []).push(m); });
  const cols = Object.keys(rows).map(Number).sort((a, b) => a - b);
  const CW = 250, RH = 24, pos = {};
  let x = 20;
  for (const c of cols){
    rows[c].sort(); let y = 20;
    for (const m of rows[c]){ pos[m] = [x, y]; y += RH; }
    x += CW;
  }
  const W = Math.max(500, cols.length * CW + 40);
  const H = Math.max(200, Math.max(...cols.map(c => rows[c].length)) * RH + 50);
  let svg = "<defs>";
  const used = {};
  for (const [a, b, k] of L){ used[k] = (used[k] || 0) + 1; }
  for (const k of Object.keys(CLR)){
    svg += '<marker id="ar-' + k + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" ' +
           'markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="' +
           CLR[k].s + '"/></marker>';
  }
  svg += "</defs>";
  for (const [a, b, k] of L){
    const p = pos[a], r = pos[b]; if (!p || !r) continue;
    const x1 = p[0] + 212, y1 = p[1] + 9, x2 = r[0], y2 = r[1] + 9;
    const c = (CLR[k] || CLR["deep-down"]).s;
    svg += '<path d="M' + x1 + ' ' + y1 + ' C' + ((x1+x2)/2) + ' ' + y1 + ' ' +
           ((x1+x2)/2) + ' ' + y2 + ' ' + x2 + ' ' + y2 +
           '" stroke="' + c + '" stroke-width="' + (k.startsWith("main") ? "2" : "1.2") +
           '" fill="none" marker-end="url(#ar-' + k + ')"/>';
  }
  for (const m of Object.keys(pos)){
    const [px, py] = pos[m], n = ND[m];
    const c = m === root ? "#56a6ff" : (n.m ? "#c98a5a" : "#59666f");
    svg += '<g class="nd" data-m="' + m + '" style="cursor:pointer">' +
      '<rect x="' + px + '" y="' + py + '" width="212" height="18" rx="4" fill="' +
      (m === root ? "#213042" : "#1b2128") + '" stroke="' + c + '"/>' +
      '<text x="' + (px + 6) + '" y="' + (py + 13) + '">' + m.slice(0, 32) + '</text></g>';
  }
  let leg = "";
  for (const k of Object.keys(CLR)){
    if (!used[k]) continue;
    leg += '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px">' +
           '<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="' +
           CLR[k].s + '" stroke-width="' + (k.startsWith("main") ? "2.5" : "1.5") +
           '"/></svg>' + CLR[k].t + ' <b style="color:#8fa0b3">(' + used[k] + ')</b></span>';
  }
  document.getElementById("graph").innerHTML =
    '<div style="padding:8px 12px;color:#8fa0b3;font-size:11px;border-bottom:1px solid #20262c">' +
    'граф: ' + Object.keys(N).length + ' узлов · ' + L.length +
    ' связей (клик по узлу — перейти)<div style="margin-top:5px">' + leg + '</div></div>' +
    '<svg width="' + W + '" height="' + H + '">' + svg + '</svg>';
  document.querySelectorAll("#graph .nd").forEach(el =>
    el.addEventListener("click", () => show(el.dataset.m)));
}

render();
// Стартовый узел: сначала MFG-сборка, потом любой СО СВЯЗЯМИ (иначе граф пуст и
// выглядит как «граф не работает»), и только затем первый из списка.
const first = shown.find(m => ND[m].m && (ND[m].o.length + ND[m].n.length)) ||
              shown.find(m => ND[m].o.length + ND[m].n.length) ||
              shown[0];
if (first) show(first);
else document.getElementById("card").innerHTML =
  '<h2>Пусто</h2><div class="meta">в базе нет моделей — просканируйте склад</div>';
</script></body></html>
